<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نشرة الرعية - حفظ تلقائي</title>
    <link
      rel="shortcut icon"
      href="saint_george_assia.png"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Aref+Ruqaa:wght@400;700&family=Audiowide&family=Cairo:wght@200..1000&family=Dancing+Script:wght@400..700&family=Dynalight&family=Lateef:wght@200;300;400;500;600;700;800&family=Manufacturing+Consent&family=Noto+Sans+Syriac+Western:wght@100..900&family=Oleo+Script:wght@400;700&family=Orbitron:wght@400..900&family=Press+Start+2P&family=Rubik+Mono+One&display=swap"
    />

  <body>
    <img class="head-title" src="title.png" alt="" />

    <div class="app-wrapper">
      <!-- ===== FORM ===== -->
      <div class="form-container">
        <h2>إدخال البيانات</h2>

        <div class="form-group">
          <label for="input-title">عنوان الأحد</label>
          <input
            type="text"
            id="input-title"
            placeholder="أدخل عنوان الأحد..."
          />
        </div>

        <div class="form-group">
          <label for="input-3adad">عدد الأحد</label>
          <input
            type="text"
            id="input-3adad"
            placeholder="أدخل عدد الأحد..."
            value="العدد "
          />
        </div>

        <div class="form-group">
          <label for="input-date">تاريخ الأحد</label>
          <input
            type="date"
            id="input-date"
            placeholder="أدخل تاريخ الأحد..."
          />
        </div>

        <div class="form-group">
          <label for="input-bible">رسالة الأحد (إنجيل / قراءة)</label>
          <textarea
            id="input-bible"
            placeholder="أدخل نص إنجيل أو رسالة الأحد..."

        </div>

        <h2>برنامج الأسبوع (من الإثنين إلى الأحد)</h2>

        <div class="form-group">
          <div class="day-title">
            <label id="label-mon">الإثنين</label>
            <input
              type="text"
              class="day-subtitle-input"
              id="subtitle-mon"
              placeholder="ملاحظة / عنوان اليوم..."
            />
          </div>
          <div class="day-events-container" id="container-mon"></div>
          <button
            type="button"
            class="btn-add-event"

            + إضافة نشاط

        </div>

        <div class="form-group">
          <div class="day-title">
            <label id="label-tue">الثلاثاء</label>
            <input
              type="text"
              class="day-subtitle-input"
              id="subtitle-tue"
              placeholder="ملاحظة / عنوان اليوم..."
            />
          </div>
          <div class="day-events-container" id="container-tue"></div>
          <button
            type="button"
            class="btn-add-event"
            onclick="addEventRow('tue')"
          >
            + إضافة نشاط
          </button>
        </div>

        <div class="form-group">
          <div class="day-title">
            <label id="label-wed">الأربعاء</label>
            <input
              type="text"
              class="day-subtitle-input"
              id="subtitle-wed"
              placeholder="ملاحظة / عنوان اليوم..."
            />
          </div>
          <div class="day-events-container" id="container-wed"></div>
          <button
            type="button"
            class="btn-add-event"
            onclick="addEventRow('wed')"

            + إضافة نشاط
          </button>
        </div>

        <div class="form-group">
          <div class="day-title">
            <label id="label-thu">الخميس</label>
            <input
              type="text"

              placeholder="ملاحظة / عنوان اليوم..."
            />
          </div>
          <div class="day-events-container" id="container-thu"></div>
          <button
            type="button"
            class="btn-add-event"
            onclick="addEventRow('thu')"
          >
            + إضافة نشاط
          </button>
        </div>

        <div class="form-group">
          <div class="day-title">
            <label id="label-fri">الجمعة</label>
            <input
              type="text"
              class="day-subtitle-input"
              id="subtitle-fri"
              placeholder="ملاحظة / عنوان اليوم..."
            />
          </div>
          <div class="day-events-container" id="container-fri"></div>
          <button
            type="button"
            class="btn-add-event"

            + إضافة نشاط

        <div class="form-group">
          <div class="day-title">

            <input
              type="text"

              placeholder="ملاحظة / عنوان اليوم..."
            />
          </div>
          <div class="day-events-container" id="container-sat"></div>
          <button
            type="button"
            class="btn-add-event"
            onclick="addEventRow('sat')"
          >
            + إضافة نشاط
          </button>
        </div>

        <div class="form-group">
          <div class="day-title">
            <label id="label-sun">الأحد</label>
            <input
              type="text"
              class="day-subtitle-input"
              id="subtitle-sun"
              placeholder="ملاحظة / عنوان اليوم..."
            />

          <div class="day-events-container" id="container-sun"></div>
          <button
            type="button"
            class="btn-add-event"
            onclick="addEventRow('sun')"
          >
            + إضافة نشاط

        <h2>أخبار الرعية</h2>
        <div class="form-group">
          <div class="day-events-container" id="container-news"></div>
          <button type="button" class="btn-add-event" onclick="addNewsRow()">

        <div class="form-group">
          <label for="input-recommendations">توصيات عامة</label>
          <textarea
            id="input-recommendations"
            placeholder="أدخل التوصيات..."
          ></textarea>
        </div>

        <h2>التنسيق والمسافات</h2>

        <div class="form-group">
          <label for="input-line-height"
            >تباعد الأسطر (Line Height) — الافتراضي 1.4</label
          >
          <input
            type="number"
            id="input-line-height"
            min="1"
            max="2.5"
            step="0.05"
            value="1.4"
          />
        </div>

        <div class="form-group">
          <label for="input-gap-bible">المسافة قبل قراءة الأحد (px)</label>
          <input
            type="number"
            id="input-gap-bible"
            min="0"
            max="120"
            step="1"
            value="12"
          />
        </div>

        <div class="form-group">
          <label for="input-gap-days">المسافة قبل برنامج الأسبوع (px)</label>
          <input
            type="number"
            id="input-gap-days"
            min="0"
            max="120"
            step="1"
            value="12"
          />
        </div>

        <div class="form-group">
          <label for="input-gap-news">المسافة قبل أخبار الرعية (px)</label>
          <input
            type="number"
            id="input-gap-news"
            min="0"
            max="120"
            step="1"
            value="12"
          />
        </div>

        <div class="form-group">
          <label for="input-gap-recs">المسافة قبل التوصيات العامة (px)</label>
          <input
            type="number"
            id="input-gap-recs"
            min="0"
            max="120"
            step="1"
            value="12"
          />
        </div>

        <button class="print-btn" onclick="downloadAsImage()">
          ↧ تحميل كصورة (PNG)
        </button>
        <button class="reset-btn" onclick="resetAllData()">
          ↺ مسح جميع البيانات (Reset)
        </button>
      </div>

      <!-- ===== PAPER ===== -->
      <div class="paper-container">
        <!-- Hidden source: single source of truth for all content -->
        <div class="paper paper-source" id="paper-source" aria-hidden="true">
          <div class="paper-header">
            <div class="sundaydetails">
              <div class="title" id="display-title">‎‏‏‎</div>
              <div class="date" id="display-3adad"></div>
              <div class="date" id="display-date">‎‏‏‎</div>
            </div>

            <div class="risele">
              <img src="title.png" alt="title" />
            </div>
            <div class="logo">
              <img src="saint_george_assia.png" alt="saint george" />
            </div>
          </div>

          <hr />

          <div class="ra3awe">
            <p class="details">رعية مار جرجس أسيا</p>
            <p class="details">الخوري يوسف الرامي فاضل: 71/371853</p>
          </div>

          <hr />

          <div id="wrapper-bible">
            <div class="content-box" id="display-bible"></div>
          </div>

          <div id="wrapper-days" class="is-hidden">
            <div class="section-title">برنامج الأسبوع</div>
            <div class="days-grid">
              <div class="day-row is-hidden" id="row-mon">
                <div class="day-header-line">
                  <span class="day-name" id="name-mon">الإثنين:</span>
                  <span class="day-subtitle" id="display-subtitle-mon"></span>
                </div>
                <span class="day-content" id="display-mon"></span>
              </div>
              <div class="day-row is-hidden" id="row-tue">
                <div class="day-header-line">
                  <span class="day-name" id="name-tue">الثلاثاء:</span>
                  <span class="day-subtitle" id="display-subtitle-tue"></span>
                </div>
                <span class="day-content" id="display-tue"></span>
              </div>
              <div class="day-row is-hidden" id="row-wed">
                <div class="day-header-line">
                  <span class="day-name" id="name-wed">الأربعاء:</span>
                  <span class="day-subtitle" id="display-subtitle-wed"></span>
                </div>
                <span class="day-content" id="display-wed"></span>
              </div>
              <div class="day-row is-hidden" id="row-thu">
                <div class="day-header-line">
                  <span class="day-name" id="name-thu">الخميس:</span>
                  <span class="day-subtitle" id="display-subtitle-thu"></span>
                </div>
                <span class="day-content" id="display-thu"></span>
              </div>
              <div class="day-row is-hidden" id="row-fri">
                <div class="day-header-line">
                  <span class="day-name" id="name-fri">الجمعة:</span>
                  <span class="day-subtitle" id="display-subtitle-fri"></span>
                </div>
                <span class="day-content" id="display-fri"></span>
              </div>
              <div class="day-row is-hidden" id="row-sat">
                <div class="day-header-line">
                  <span class="day-name" id="name-sat">السبت:</span>
                  <span class="day-subtitle" id="display-subtitle-sat"></span>
                </div>
                <span class="day-content" id="display-sat"></span>
              </div>
              <div class="day-row is-hidden" id="row-sun">
                <div class="day-header-line">
                  <span class="day-name" id="name-sun">الأحد:</span>
                  <span class="day-subtitle" id="display-subtitle-sun"></span>
                </div>
                <span class="day-content" id="display-sun"></span>
              </div>
            </div>
          </div>

          <div id="wrapper-news" class="is-hidden">
            <div class="section-title">أخبار الرعية</div>
            <div class="news-grid" id="display-news-grid"></div>
          </div>

          <div id="wrapper-recommendations" class="is-hidden">
            <div class="section-title">توصيات عامة</div>
            <div class="content-box" id="display-recommendations"></div>
          </div>

          <div class="paperfooter">1/1</div>
        </div>

        <!-- Generated pages (one .paper per page) -->
        <div class="paper-pages" id="paper-to-print"></div>
      </div>
    </div>

    <script>
      // ============================================================
      // 1. CONSTANTS & HELPERS
      // ============================================================
      const levantMonths = [
        "كانون الثاني",
        "شباط",
        "آذار",
        "نيسان",
        "أيار",
        "حزيران",
        "تموز",
        "آب",
        "أيلول",
        "تشرين الأول",
        "تشرين الثاني",
        "كانون الأول",
      ];

      const dayNames = {
        mon: "✸ الإثنين",
        tue: "✸ الثلاثاء",
        wed: "✸ الأربعاء",
        thu: "✸ الخميس",
        fri: "✸ الجمعة",
        sat: "✸ السبت",
        sun: "✸ الأحد",
      };

      const dayOffsets = {
        mon: 0,
        tue: 1,
        wed: 2,
        thu: 3,
        fri: 4,
        sat: 5,
        sun: 6,
      };
      const dayKeys = Object.keys(dayOffsets);

      const LS_PREFIX = "nashra_";
      const LS_KEYS = {
        title: LS_PREFIX + "title",
        aadad: LS_PREFIX + "aadad",
        date: LS_PREFIX + "date",
        bible: LS_PREFIX + "bible",
        recommendations: LS_PREFIX + "recommendations",
        daySubtitles: LS_PREFIX + "daySubtitles",
        dayEvents: LS_PREFIX + "dayEvents",
        newsItems: LS_PREFIX + "newsItems",
        gaps: LS_PREFIX + "gaps",
        lineHeight: LS_PREFIX + "lineHeight",
      };

      // Pagination settings
      const PAGE_GAP = 12;
      const FOOTER_RESERVE = 30;
      let paginateTimer = null;

      // ---- Spacing helpers ----
      function parseGapValue(id) {
        const el = document.getElementById(id);
        if (!el) return PAGE_GAP;
        const v = parseFloat(el.value);
        return isNaN(v) || v < 0 ? PAGE_GAP : v;
      }

      function getSectionGaps() {
        return {
          bible: parseGapValue("input-gap-bible"),
          days: parseGapValue("input-gap-days"),
          news: parseGapValue("input-gap-news"),
          recs: parseGapValue("input-gap-recs"),
        };
      }

      function applyLineHeight() {
        const el = document.getElementById("input-line-height");
        if (!el) return;
        const v = parseFloat(el.value);
        if (!isNaN(v) && v > 0) {
          document.documentElement.style.setProperty(
            "--content-paper-line-height",
            v,
          );
        }
      }

      // ============================================================
      // 2. DATE FUNCTIONS
      // ============================================================
      function getWeekMonday() {
        const now = new Date();
        const currentDay = now.getDay();
        const diffToMonday = currentDay === 0 ? 1 : 1 - currentDay;
        const monday = new Date(now);
        monday.setDate(now.getDate() + diffToMonday);
        return monday;
      }

      function initDates() {
        const monday = getWeekMonday();
        dayKeys.forEach((dayKey) => {
          const targetDate = new Date(monday);
          targetDate.setDate(monday.getDate() + dayOffsets[dayKey]);
          const dayNum = targetDate.getDate();
          const monthName = levantMonths[targetDate.getMonth()];
          const yearNum = targetDate.getFullYear();
          const formattedLabel = `${dayNames[dayKey]} ${dayNum} ${monthName} ${yearNum}`;
          const labelEl = document.getElementById(`label-${dayKey}`);
          const nameEl = document.getElementById(`name-${dayKey}`);
          if (labelEl) labelEl.textContent = formattedLabel;
          if (nameEl) nameEl.textContent = `${formattedLabel}:`;
        });
      }

      function formatInputDate(dateStr) {
        if (!dateStr) return "‎‏‏‎";
        const [year, month, day] = dateStr.split("-");
        if (!year || !month || !day) return dateStr;
        const monthIdx = parseInt(month, 10) - 1;
        const monthName = levantMonths[monthIdx] || month;
        return `${parseInt(day, 10)} ${monthName} ${year}`;
      }

      // ============================================================
      // 3. SAVE / LOAD / RESET STATE
      // ============================================================
      function saveAllData() {
        localStorage.setItem(
          LS_KEYS.title,
          document.getElementById("input-title").value,
        );
        localStorage.setItem(
          LS_KEYS.aadad,
          document.getElementById("input-3adad").value,
        );
        localStorage.setItem(
          LS_KEYS.date,
          document.getElementById("input-date").value,
        );
        localStorage.setItem(
          LS_KEYS.bible,
          document.getElementById("input-bible").value,
        );
        localStorage.setItem(
          LS_KEYS.recommendations,
          document.getElementById("input-recommendations").value,
        );

        // Day subtitles
        const subtitles = {};
        dayKeys.forEach((k) => {
          const el = document.getElementById(`subtitle-${k}`);
          subtitles[k] = el ? el.value : "";
        });
        localStorage.setItem(LS_KEYS.daySubtitles, JSON.stringify(subtitles));

        // Day events
        const allEvents = {};
        dayKeys.forEach((k) => {
          const container = document.getElementById(`container-${k}`);
          if (!container) return;
          const rows = container.querySelectorAll(".event-row-input");
          const evs = [];
          rows.forEach((row) => {
            const time = row.querySelector(".day-time-input")?.value || "";
            const text = row.querySelector(".day-input")?.value || "";
            evs.push({ time, text });
          });
          allEvents[k] = evs;
        });
        localStorage.setItem(LS_KEYS.dayEvents, JSON.stringify(allEvents));

        // News items
        const newsContainer = document.getElementById("container-news");
        const newsRows = newsContainer
          ? newsContainer.querySelectorAll(".news-row-input")
          : [];
        const newsData = [];
        newsRows.forEach((row) => {
          const title = row.querySelector(".news-title-input")?.value || "";
          const imgInput = row.querySelector(".news-img-input");
          let imgData = "";
          if (imgInput && imgInput.files && imgInput.files.length > 0) {
            imgData = "HAS_IMAGE";
          } else {
            const previewImg = row.querySelector(".news-item-img-preview");
            if (
              previewImg &&
              previewImg.src &&
              previewImg.src.startsWith("data:image")
            ) {
              imgData = "HAS_IMAGE";
            } else if (
              previewImg &&
              previewImg.src &&
              !previewImg.src.includes("saint_george_assia.png")
            ) {
              imgData = "HAS_IMAGE";
            }
          }
          newsData.push({ title, imgFlag: imgData });
        });
        localStorage.setItem(LS_KEYS.newsItems, JSON.stringify(newsData));

        // Gaps
        localStorage.setItem(
          LS_KEYS.gaps,
          JSON.stringify({
            bible: document.getElementById("input-gap-bible").value,
            days: document.getElementById("input-gap-days").value,
            news: document.getElementById("input-gap-news").value,
            recs: document.getElementById("input-gap-recs").value,
          }),
        );

        // Line height
        localStorage.setItem(
          LS_KEYS.lineHeight,
          document.getElementById("input-line-height").value,
        );

        schedulePaginate();
      }

      function loadAllData() {
        const titleVal = localStorage.getItem(LS_KEYS.title);
        if (titleVal !== null)
          document.getElementById("input-title").value = titleVal;

        const aadadVal = localStorage.getItem(LS_KEYS.aadad);
        if (aadadVal !== null)
          document.getElementById("input-3adad").value = aadadVal;

        const dateVal = localStorage.getItem(LS_KEYS.date);
        if (dateVal !== null)
          document.getElementById("input-date").value = dateVal;

        const bibleVal = localStorage.getItem(LS_KEYS.bible);
        if (bibleVal !== null)
          document.getElementById("input-bible").value = bibleVal;

        const recVal = localStorage.getItem(LS_KEYS.recommendations);
        if (recVal !== null)
          document.getElementById("input-recommendations").value = recVal;

        const savedGaps = localStorage.getItem(LS_KEYS.gaps);
        if (savedGaps) {
          try {
            const g = JSON.parse(savedGaps);
            if (g.bible !== undefined)
              document.getElementById("input-gap-bible").value = g.bible;
            if (g.days !== undefined)
              document.getElementById("input-gap-days").value = g.days;
            if (g.news !== undefined)
              document.getElementById("input-gap-news").value = g.news;
            if (g.recs !== undefined)
              document.getElementById("input-gap-recs").value = g.recs;
          } catch (e) {}
        }

        const savedLH = localStorage.getItem(LS_KEYS.lineHeight);
        if (savedLH !== null) {
          document.getElementById("input-line-height").value = savedLH;
        }
        applyLineHeight();

        const savedSubtitles = localStorage.getItem(LS_KEYS.daySubtitles);
        if (savedSubtitles) {
          try {
            const subs = JSON.parse(savedSubtitles);
            dayKeys.forEach((k) => {
              const el = document.getElementById(`subtitle-${k}`);
              if (el && subs[k] !== undefined) el.value = subs[k];
            });
          } catch (e) {}
        }

        const savedEvents = localStorage.getItem(LS_KEYS.dayEvents);
        if (savedEvents) {
          try {
            const evs = JSON.parse(savedEvents);
            dayKeys.forEach((k) => {
              const container = document.getElementById(`container-${k}`);
              if (!container) return;
              container.innerHTML = "";
              const dayEvents = evs[k] || [];
              dayEvents.forEach((ev) => {
                addEventRowWithData(k, ev.time, ev.text);
              });
            });
          } catch (e) {}
        }

        const savedNews = localStorage.getItem(LS_KEYS.newsItems);
        if (savedNews) {
          try {
            const news = JSON.parse(savedNews);
            const container = document.getElementById("container-news");
            if (container) container.innerHTML = "";
            news.forEach((item) => {
              addNewsRowWithData(item.title, item.imgFlag);
            });
          } catch (e) {}
        }

        refreshAllDisplays();
      }

      function resetAllData() {
        if (!confirm("هل أنت متأكد من مسح جميع البيانات؟ لا يمكن التراجع."))
          return;

        Object.values(LS_KEYS).forEach((key) => localStorage.removeItem(key));

        document.getElementById("input-title").value = "";
        document.getElementById("input-3adad").value = "العدد ";
        document.getElementById("input-date").value = "";
        document.getElementById("input-bible").value = "";
        document.getElementById("input-recommendations").value = "";

        document.getElementById("input-line-height").value = "1.4";
        document.getElementById("input-gap-bible").value = "12";
        document.getElementById("input-gap-days").value = "12";
        document.getElementById("input-gap-news").value = "12";
        document.getElementById("input-gap-recs").value = "12";
        applyLineHeight();

        dayKeys.forEach((k) => {
          const el = document.getElementById(`subtitle-${k}`);
          if (el) el.value = "";
        });

        dayKeys.forEach((k) => {
          const container = document.getElementById(`container-${k}`);
          if (container) container.innerHTML = "";
          addEventRow(k);
        });

        const newsContainer = document.getElementById("container-news");
        if (newsContainer) newsContainer.innerHTML = "";
        addNewsRow();

        refreshAllDisplays();
      }

      // ============================================================
      // 9. PAGINATION ENGINE
      // ============================================================
      let measureBox = null;

      function getMeasureBox(width) {
        if (!measureBox) {
          measureBox = document.createElement("div");
          measureBox.id = "measure-box";
          measureBox.style.cssText =
            "position:fixed;left:-10000px;top:0;visibility:hidden;pointer-events:none;";
          document.body.appendChild(measureBox);
        }
        measureBox.style.width = Math.floor(width) + "px";
        return measureBox;
      }

      function measureElementHeight(el, contentWidth) {
        const box = getMeasureBox(contentWidth);
        box.appendChild(el);
        const cs = getComputedStyle(el);
        const h =
          el.getBoundingClientRect().height +
          (parseFloat(cs.marginTop) || 0) +
          (parseFloat(cs.marginBottom) || 0);
        box.removeChild(el);
        return h;
      }

      function createTextMeasurer(className, contentWidth) {
        const box = getMeasureBox(contentWidth);
        const probe = document.createElement("div");
        probe.className = className;
        box.appendChild(probe);
        return {
          measure(text) {
            probe.textContent = text;
            return probe.getBoundingClientRect().height;
          },
          dispose() {
            if (probe.parentNode) probe.parentNode.removeChild(probe);
          },
        };
      }

      function stripIds(node) {
        if (!node || node.nodeType !== 1) return node;
        if (node.id) node.removeAttribute("id");
        node.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
        return node;
      }

      function schedulePaginate() {
        if (paginateTimer) clearTimeout(paginateTimer);
        paginateTimer = setTimeout(() => {
          paginateTimer = null;
          paginate();
        }, 250);
      }

      function computePageMetrics() {
        const src = document.getElementById("paper-source");
        const cs = getComputedStyle(src);
        const rect = src.getBoundingClientRect();
        const padTop = parseFloat(cs.paddingTop) || 0;
        const padBottom = parseFloat(cs.paddingBottom) || 0;
        const padLeft = parseFloat(cs.paddingLeft) || 0;
        const padRight = parseFloat(cs.paddingRight) || 0;
        const contentWidth = rect.width - padLeft - padRight;
        const usableHeight = rect.height - padTop - padBottom - FOOTER_RESERVE;
        return { contentWidth, usableHeight };
      }

      function splitTextIntoChunks(text, maxHeight, measureFn) {
        const chunks = [];
        if (!text) return chunks;
        const lines = text.split("\n");
        let current = "";
        const flush = () => {
          if (current !== "") chunks.push(current);
          current = "";
        };

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const candidate = current === "" ? line : current + "\n" + line;
          if (measureFn(candidate) <= maxHeight) {
            current = candidate;
            continue;
          }

          flush();

          if (measureFn(line) <= maxHeight) {
            current = line;
            continue;
          }

          const words = line.split(" ");
          let buf = "";
          for (let j = 0; j < words.length; j++) {
            const cand = buf === "" ? words[j] : buf + " " + words[j];
            if (measureFn(cand) <= maxHeight) {
              buf = cand;
            } else {
              if (buf !== "") chunks.push(buf);
              buf = words[j];
            }
          }
          current = buf;
        }
        flush();
        return chunks;
      }

      function pushBlock(blocks, el, type, metrics, section) {
        const clone = stripIds(el.cloneNode(true));
        const h = measureElementHeight(clone, metrics.contentWidth);
        blocks.push({ el: clone, h, type, section });
      }

      function pushTextBlocks(
        blocks,
        text,
        className,
        metrics,
        maxHeight,
        section,
      ) {
        if (!text || !text.trim()) return;
        const measurer = createTextMeasurer(className, metrics.contentWidth);
        const limit = Math.max(120, maxHeight - 5);
        const chunks = splitTextIntoChunks(text, limit, measurer.measure);
        measurer.dispose();

        chunks.forEach((chunk) => {
          const div = document.createElement("div");
          div.className = className;
          div.textContent = chunk;
          const h = measureElementHeight(div, metrics.contentWidth);
          blocks.push({ el: div, h, type: "text", section });
        });
      }

      // ---- First page header (built from source) ----
      function buildFirstHeaderTemplate(source) {

      // ---- Continuation header (pages 2+) ----
      function buildContinuationHeaderTemplate() {

      function buildBlocks(metrics, sectionGaps) {
        const source = document.getElementById("paper-source");

        const firstHeaderTemplate = buildFirstHeaderTemplate(source);
        const contHeaderTemplate = buildContinuationHeaderTemplate();

        const firstHeaderHeight = measureElementHeight(
          firstHeaderTemplate.cloneNode(true),
          metrics.contentWidth,
        );
        const contHeaderHeight = measureElementHeight(
          contHeaderTemplate.cloneNode(true),
          metrics.contentWidth,
        );

        const maxHeaderHeight = Math.max(firstHeaderHeight, contHeaderHeight);
        const textMaxForSection = (gap) =>
          metrics.usableHeight - maxHeaderHeight - Math.max(PAGE_GAP, gap);

        const blocks = [];

        // ---- Bible / reading ----
        const bibleWrapper = source.querySelector("#wrapper-bible");
        if (bibleWrapper && !bibleWrapper.classList.contains("is-hidden")) {
          const bibleEl = bibleWrapper.querySelector("#display-bible");
          if (bibleEl) {
            pushTextBlocks(
              blocks,
              bibleEl.textContent || "",
              "content-box",
              metrics,
              textMaxForSection(sectionGaps.bible),
              "bible",
            );
          }
        }

        // ---- Weekly programme ----
        const daysWrapper = source.querySelector("#wrapper-days");
        if (daysWrapper && !daysWrapper.classList.contains("is-hidden")) {
          const titleEl = daysWrapper.querySelector(".section-title");
          if (titleEl) pushBlock(blocks, titleEl, "title", metrics, "days");
          daysWrapper.querySelectorAll(".day-row").forEach((row) => {
            if (!row.classList.contains("is-hidden")) {
              pushBlock(blocks, row, "day", metrics, "days");
            }
          });
        }

        // ---- News ----
        const newsWrapper = source.querySelector("#wrapper-news");
        if (newsWrapper && !newsWrapper.classList.contains("is-hidden")) {
          const titleEl = newsWrapper.querySelector(".section-title");
          if (titleEl) pushBlock(blocks, titleEl, "title", metrics, "news");
          newsWrapper.querySelectorAll(".news-item").forEach((item) => {
            pushBlock(blocks, item, "news", metrics, "news");
          });
        }

        // ---- Recommendations ----
        const recWrapper = source.querySelector("#wrapper-recommendations");
        if (recWrapper && !recWrapper.classList.contains("is-hidden")) {
          const titleEl = recWrapper.querySelector(".section-title");
          if (titleEl) pushBlock(blocks, titleEl, "title", metrics, "recs");
          const recEl = recWrapper.querySelector("#display-recommendations");
          if (recEl) {
            pushTextBlocks(
              blocks,
              recEl.textContent || "",
              "content-box",
              metrics,
              textMaxForSection(sectionGaps.recs),
              "recs",
            );
          }
        }

        // Mark first block of each section
        let prevSection = null;
        blocks.forEach((b) => {
          b.isSectionStart = b.section !== prevSection;
          prevSection = b.section;
        });

        return {
          blocks,
          firstHeaderTemplate,
          contHeaderTemplate,
          firstHeaderHeight,
          contHeaderHeight,
        };
      }

      function distributeBlocks(
        blocks,
        metrics,
        firstHeaderHeight,
        contHeaderHeight,
        sectionGaps,
      ) {
        const pages = [];
        const usable = metrics.usableHeight;

        let current = { blocks: [], height: firstHeaderHeight };

        const startNewPage = () => {
          pages.push(current);
          current = { blocks: [], height: contHeaderHeight };
        };

        const computeGap = (block) => {
          if (block.isSectionStart) {
            const v = sectionGaps[block.section];
            return typeof v === "number" && !isNaN(v) ? v : PAGE_GAP;
          }
          return PAGE_GAP;
        };

        const capGapForPage = (gap, block) => {
          if (current.blocks.length !== 0) return gap;
          const maxGap = Math.max(0, usable - current.height - block.h);
          return Math.min(gap, maxGap);
        };

        for (let i = 0; i < blocks.length; i++) {
          const block = blocks[i];
          let gap = capGapForPage(computeGap(block), block);

          if (block.type === "title" && i + 1 < blocks.length) {
            const next = blocks[i + 1];
            const togetherHeight = gap + block.h + PAGE_GAP + next.h;
            if (
              current.height + togetherHeight > usable &&
              current.blocks.length > 0
            ) {
              startNewPage();
              gap = capGapForPage(computeGap(block), block);
            }
          }

          if (
            current.height + gap + block.h > usable &&
            current.blocks.length > 0
          ) {
            startNewPage();
            gap = capGapForPage(computeGap(block), block);
          }

          block.gapBefore = gap;
          current.blocks.push(block);
          current.height += gap + block.h;
        }

        if (current.blocks.length > 0 || pages.length === 0) {
          pages.push(current);
        }
        return pages;
      }

      function renderPages(pages, firstHeaderTemplate, contHeaderTemplate) {
        const container = document.getElementById("paper-to-print");
        if (!container) return;
        container.innerHTML = "";

        const total = pages.length;

        pages.forEach((page, index) => {
          const pageEl = document.createElement("div");
          pageEl.className = "paper";
          pageEl.setAttribute("data-page", String(index + 1));

          const contentEl = document.createElement("div");
          contentEl.className = "paper-content";

          const headerTpl =
            index === 0 ? firstHeaderTemplate : contHeaderTemplate;
          if (headerTpl) {
            contentEl.appendChild(headerTpl.cloneNode(true));
          }

          page.blocks.forEach((b) => {
            const gap = b.gapBefore != null ? b.gapBefore : PAGE_GAP;
            b.el.style.marginTop = gap + "px";
            contentEl.appendChild(b.el);
          });

          const footer = document.createElement("div");
          footer.className = "paperfooter";
          footer.textContent = `${index + 1}/${total}`;

          pageEl.appendChild(contentEl);
          pageEl.appendChild(footer);
          container.appendChild(pageEl);
        });
      }

      function paginate() {
        const source = document.getElementById("paper-source");
        if (!source) return;
        try {
          const metrics = computePageMetrics();
          if (metrics.contentWidth <= 0 || metrics.usableHeight <= 0) return;

          const sectionGaps = getSectionGaps();
          const {
            blocks,
            firstHeaderTemplate,
            contHeaderTemplate,
            firstHeaderHeight,
            contHeaderHeight,
          } = buildBlocks(metrics, sectionGaps);

          const pages = distributeBlocks(
            blocks,
            metrics,
            firstHeaderHeight,
            contHeaderHeight,
            sectionGaps,
          );

          renderPages(pages, firstHeaderTemplate, contHeaderTemplate);
        } catch (err) {
          console.error("Pagination error:", err);
        }
      }

      // ============================================================
      // 10. DOWNLOAD AS IMAGE
      // ============================================================
      async function downloadAsImage() {
        const pages = Array.from(
          document.querySelectorAll("#paper-to-print .paper"),
        );
        if (pages.length === 0) return;

        const btn = document.querySelector(".print-btn");
        if (btn) btn.disabled = true;

        const pagesWrap = document.getElementById("paper-to-print");
        const prevZoom = pagesWrap.style.zoom;
        pagesWrap.style.zoom = "1";

        try {
          for (let i = 0; i < pages.length; i++) {
            const pageEl = pages[i];

            const canvas = await html2canvas(pageEl, {
              scale: 4,
              useCORS: true,
              allowTaint: true,
              logging: false,
              backgroundColor: "#ffffff",
              windowWidth: 1200,
              windowHeight: 1600,
            });

            const link = document.createElement("a");
            if (pages.length === 1) {
              link.download = "saint_george_assia_highres.png";
            } else {
              link.download = `saint_george_assia_page_${i + 1}_of_${pages.length}.png`;
            }
            link.href = canvas.toDataURL("image/png", 1.0);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            if (i < pages.length - 1) {
              await new Promise((r) => setTimeout(r, 400));
            }
          }
        } catch (err) {
          console.error("Export Error:", err);
        } finally {
          pagesWrap.style.zoom = prevZoom;
          if (btn) btn.disabled = false;
        }
      }

      // ============================================================
      // 11. INIT
      // ============================================================
      window.addEventListener("DOMContentLoaded", () => {
        initDates();
        attachSimpleListeners();
        loadAllData();

        dayKeys.forEach((k) => {
          const container = document.getElementById(`container-${k}`);
          if (container && container.children.length === 0) {
            addEventRow(k);
          }
        });

        const newsContainer = document.getElementById("container-news");
        if (newsContainer && newsContainer.children.length === 0) {
          addNewsRow();
        }

        refreshAllDisplays();

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => paginate());
        }

        window.addEventListener("beforeunload", () => {
          saveAllData();
        });

        document.addEventListener("input", (e) => {
          if (e.target.closest(".form-container")) {
            saveAllData();
          }
        });
      });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  </body>
</html>
