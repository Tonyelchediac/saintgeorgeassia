<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نشرة الرعية - حفظ تلقائي</title>
    <link
      rel="shortcut icon"
      href="saint_george_assia.png"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Aref+Ruqaa:wght@400;700&family=Audiowide&family=Cairo:wght@200..1000&family=Dancing+Script:wght@400..700&family=Dynalight&family=Lateef:wght@200;300;400;500;600;700;800&family=Manufacturing+Consent&family=Noto+Sans+Syriac+Western:wght@100..900&family=Oleo+Script:wght@400;700&family=Orbitron:wght@400..900&family=Press+Start+2P&family=Rubik+Mono+One&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <img class="head-title" src="title.png" alt="" />

    <div class="app-wrapper">
      <!-- ===== FORM ===== -->
      <div class="form-container">
        <h2>إدخال البيانات</h2>

        <div class="form-group">
          <label for="input-title">عنوان الأحد</label>
          <input
            type="text"
            id="input-title"
            placeholder="أدخل عنوان الأحد..."
          />
        </div>

        <div class="form-group">
          <label for="input-3adad">عدد الأحد</label>
          <input
            type="text"
            id="input-3adad"
            placeholder="أدخل عدد الأحد..."
            value="العدد "
          />
        </div>

        <div class="form-group">
          <label for="input-date">تاريخ الأحد</label>
          <input
            type="date"
            id="input-date"
            placeholder="أدخل تاريخ الأحد..."
          />
        </div>

        <div class="form-group">
          <label for="input-bible">رسالة الأحد (إنجيل / قراءة)</label>
          <textarea
            id="input-bible"
            placeholder="أدخل نص إنجيل أو رسالة الأحد..."
          ></textarea>
        </div>

        <h2>برنامج الأسبوع (من الإثنين إلى الأحد)</h2>

        <div class="form-group">
          <div class="day-title">
            <label id="label-mon">الإثنين</label>
            <input
              type="text"
              class="day-subtitle-input"
              id="subtitle-mon"
              placeholder="ملاحظة / عنوان اليوم..."
            />
          </div>
          <div
            class="day-events-container"
            id="container-mon"
            style="display: none"
          ></div>
          <button
            type="button"
            class="btn-add-event"
            onclick="toggleDayEvents('mon')"
          >
            + إضافة نشاط
          </button>
        </div>

        <div class="form-group">
          <div class="day-title">
            <label id="label-tue">الثلاثاء</label>
            <input
              type="text"
              class="day-subtitle-input"
              id="subtitle-tue"
              placeholder="ملاحظة / عنوان اليوم..."
            />
          </div>
          <div
            class="day-events-container"
            id="container-tue"
            style="display: none"
          ></div>
          <button
            type="button"
            class="btn-add-event"
            onclick="toggleDayEvents('tue')"
          >
            + إضافة نشاط
          </button>
        </div>

        <div class="form-group">
          <div class="day-title">
            <label id="label-wed">الأربعاء</label>
            <input
              type="text"
              class="day-subtitle-input"
              id="subtitle-wed"
              placeholder="ملاحظة / عنوان اليوم..."
            />
          </div>
          <div
            class="day-events-container"
            id="container-wed"
            style="display: none"
          ></div>
          <button
            type="button"
            class="btn-add-event"
            onclick="toggleDayEvents('wed')"
          >
            + إضافة نشاط
          </button>
        </div>

        <div class="form-group">
          <div class="day-title">
            <label id="label-thu">الخميس</label>
            <input
              type="text"
              class="day-subtitle-input"
              id="subtitle-thu"
              placeholder="ملاحظة / عنوان اليوم..."
            />
          </div>
          <div
            class="day-events-container"
            id="container-thu"
            style="display: none"
          ></div>
          <button
            type="button"
            class="btn-add-event"
            onclick="toggleDayEvents('thu')"
          >
            + إضافة نشاط
          </button>
        </div>

        <div class="form-group">
          <div class="day-title">
            <label id="label-fri">الجمعة</label>
            <input
              type="text"
              class="day-subtitle-input"
              id="subtitle-fri"
              placeholder="ملاحظة / عنوان اليوم..."
            />
          </div>
          <div
            class="day-events-container"
            id="container-fri"
            style="display: none"
          ></div>
          <button
            type="button"
            class="btn-add-event"
            onclick="toggleDayEvents('fri')"
          >
            + إضافة نشاط
          </button>
        </div>

        <div class="form-group">
          <div class="day-title">
            <label id="label-sat">السبت</label>
            <input
              type="text"
              class="day-subtitle-input"
              id="subtitle-sat"
              placeholder="ملاحظة / عنوان اليوم..."
            />
          </div>
          <div
            class="day-events-container"
            id="container-sat"
            style="display: none"
          ></div>
          <button
            type="button"
            class="btn-add-event"
            onclick="toggleDayEvents('sat')"
          >
            + إضافة نشاط
          </button>
        </div>

        <div class="form-group">
          <div class="day-title">
            <label id="label-sun">الأحد</label>
            <input
              type="text"
              class="day-subtitle-input"
              id="subtitle-sun"
              placeholder="ملاحظة / عنوان اليوم..."
            />
          </div>
          <div
            class="day-events-container"
            id="container-sun"
            style="display: none"
          ></div>
          <button
            type="button"
            class="btn-add-event"
            onclick="toggleDayEvents('sun')"
          >
            + إضافة نشاط
          </button>
        </div>

        <h2>أخبار الرعية</h2>
        <div class="form-group">
          <div class="day-events-container" id="container-news"></div>
          <button type="button" class="btn-add-event" onclick="addNewsRow()">
            + إضافة خبر جديد
          </button>
        </div>

        <div class="form-group">
          <label for="input-recommendations">توصيات عامة</label>
          <textarea
            id="input-recommendations"
            placeholder="أدخل التوصيات..."
          ></textarea>
        </div>

        <h2>التنسيق والمسافات</h2>

        <div class="form-group">
          <label for="input-line-height"
            >تباعد الأسطر (Line Height) — الافتراضي 1.4</label
          >
          <input
            type="number"
            id="input-line-height"
            min="1"
            max="2.5"
            step="0.05"
            value="1.4"
          />
        </div>

        <div class="form-group">
          <label for="input-gap-bible">المسافة قبل قراءة الأحد (px)</label>
          <input
            type="number"
            id="input-gap-bible"
            min="0"
            max="120"
            step="1"
            value="12"
          />
        </div>

        <div class="form-group">
          <label for="input-gap-days">المسافة قبل برنامج الأسبوع (px)</label>
          <input
            type="number"
            id="input-gap-days"
            min="0"
            max="120"
            step="1"
            value="12"
          />
        </div>

        <div class="form-group">
          <label for="input-gap-news">المسافة قبل أخبار الرعية (px)</label>
          <input
            type="number"
            id="input-gap-news"
            min="0"
            max="120"
            step="1"
            value="12"
          />
        </div>

        <div class="form-group">
          <label for="input-gap-recs">المسافة قبل التوصيات العامة (px)</label>
          <input
            type="number"
            id="input-gap-recs"
            min="0"
            max="120"
            step="1"
            value="12"
          />
        </div>

        <button class="print-btn" onclick="downloadAsImage()">
          ↧ تحميل كصورة (PNG)
        </button>
        <button class="reset-btn" onclick="resetAllData()">
          ↺ مسح جميع البيانات (Reset)
        </button>
      </div>

      <!-- ===== PAPER ===== -->
      <div class="paper-container">
        <!-- Hidden source: single source of truth for all content -->
        <div class="paper paper-source" id="paper-source" aria-hidden="true">
          <div class="paper-header">
            <div class="logo">
              <img
                src="saint_george_assia.png"
                alt="saint geoge"
                class="saint"
              />
              <img src="title.png" alt="title" class="risele" />
            </div>
            <div class="sundaydetails">
              <div class="title" id="display-title">‎‏‏‎</div>
              <div class="date" id="display-3adad"></div>
              <div class="date" id="display-date">‎‏‏‎</div>
            </div>
          </div>

          <hr />

          <div class="ra3awe">
            <p class="details">رعية مار جرجس أسيا</p>
            <p class="details">الخوري يوسف الرامي فاضل: 71/371853</p>
          </div>

          <hr />

          <div id="wrapper-bible">
            <div class="content-box" id="display-bible"></div>
          </div>

          <div id="wrapper-days" class="is-hidden">
            <div class="section-title">برنامج الأسبوع</div>
            <div class="days-grid">
              <div class="day-row is-hidden" id="row-mon">
                <div class="day-header-line">
                  <span class="day-name" id="name-mon">الإثنين:</span>
                  <span class="day-subtitle" id="display-subtitle-mon"></span>
                </div>
                <span class="day-content" id="display-mon"></span>
              </div>
              <div class="day-row is-hidden" id="row-tue">
                <div class="day-header-line">
                  <span class="day-name" id="name-tue">الثلاثاء:</span>
                  <span class="day-subtitle" id="display-subtitle-tue"></span>
                </div>
                <span class="day-content" id="display-tue"></span>
              </div>
              <div class="day-row is-hidden" id="row-wed">
                <div class="day-header-line">
                  <span class="day-name" id="name-wed">الأربعاء:</span>
                  <span class="day-subtitle" id="display-subtitle-wed"></span>
                </div>
                <span class="day-content" id="display-wed"></span>
              </div>
              <div class="day-row is-hidden" id="row-thu">
                <div class="day-header-line">
                  <span class="day-name" id="name-thu">الخميس:</span>
                  <span class="day-subtitle" id="display-subtitle-thu"></span>
                </div>
                <span class="day-content" id="display-thu"></span>
              </div>
              <div class="day-row is-hidden" id="row-fri">
                <div class="day-header-line">
                  <span class="day-name" id="name-fri">الجمعة:</span>
                  <span class="day-subtitle" id="display-subtitle-fri"></span>
                </div>
                <span class="day-content" id="display-fri"></span>
              </div>
              <div class="day-row is-hidden" id="row-sat">
                <div class="day-header-line">
                  <span class="day-name" id="name-sat">السبت:</span>
                  <span class="day-subtitle" id="display-subtitle-sat"></span>
                </div>
                <span class="day-content" id="display-sat"></span>
              </div>
              <div class="day-row is-hidden" id="row-sun">
                <div class="day-header-line">
                  <span class="day-name" id="name-sun">الأحد:</span>
                  <span class="day-subtitle" id="display-subtitle-sun"></span>
                </div>
                <span class="day-content" id="display-sun"></span>
              </div>
            </div>
          </div>

          <div id="wrapper-news" class="is-hidden">
            <div class="section-title">أخبار الرعية</div>
            <div class="news-grid" id="display-news-grid"></div>
          </div>

          <div id="wrapper-recommendations" class="is-hidden">
            <div class="section-title">توصيات عامة</div>
            <div class="content-box" id="display-recommendations"></div>
          </div>

          <div class="paperfooter">1/1</div>
        </div>

        <!-- Generated pages (one .paper per page) -->
        <div class="paper-pages" id="paper-to-print"></div>
      </div>
    </div>

    <script src="script.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  </body>
</html>
