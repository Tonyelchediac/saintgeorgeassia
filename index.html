    <script>

        const STORAGE_KEY =
            'saintGeorgeAssiaParishNewsletter';


        /* =====================================================
           MONTHS
        ====================================================== */

        const levantMonths = [
            "كانون الثاني",
            "شباط",
            "آذار",
            "نيسان",
            "أيار",
            "حزيران",
            "تموز",
            "آب",
            "أيلول",
            "تشرين الأول",
            "تشرين الثاني",
            "كانون الأول"
        ];


        /* =====================================================
           DAYS
        ====================================================== */

        const dayNames = {

            mon: "✸ الإثنين",

            tue: "✸ الثلاثاء",

            wed: "✸ الأربعاء",

            thu: "✸ الخميس",

            fri: "✸ الجمعة",

            sat: "✸ السبت",

            sun: "✸ الأحد"

        };


        const dayOffsets = {

            mon: 0,

            tue: 1,

            wed: 2,

            thu: 3,

            fri: 4,

            sat: 5,

            sun: 6

        };


        /* =====================================================
           GET MONDAY
        ====================================================== */

        function getWeekMonday() {

            const now =
                new Date();

            const currentDay =
                now.getDay();

            const diffToMonday =
                currentDay === 0
                    ? 1
                    : 1 - currentDay;

            const monday =
                new Date(now);

            monday.setDate(
                now.getDate() +
                diffToMonday
            );

            return monday;
        }


        /* =====================================================
           INITIALIZE DAY DATES
        ====================================================== */

        function initDates() {

            const monday =
                getWeekMonday();

            Object.keys(dayOffsets)
                .forEach(dayKey => {

                    const targetDate =
                        new Date(monday);

                    targetDate.setDate(
                        monday.getDate() +
                        dayOffsets[dayKey]
                    );

                    const dayNum =
                        targetDate.getDate();

                    const monthName =
                        levantMonths[
                            targetDate.getMonth()
                        ];

                    const yearNum =
                        targetDate.getFullYear();

                    const formattedLabel =
                        `${dayNames[dayKey]} ${dayNum} ${monthName} ${yearNum}`;

                    const labelEl =
                        document.getElementById(
                            `label-${dayKey}`
                        );

                    const nameEl =
                        document.getElementById(
                            `name-${dayKey}`
                        );

                    if (labelEl) {

                        labelEl.textContent =
                            formattedLabel;

                    }

                    if (nameEl) {

                        nameEl.textContent =
                            `${formattedLabel}:`;

                    }

                });
        }


        /* =====================================================
           FORMAT DATE
        ====================================================== */

        function formatInputDate(dateStr) {

            if (!dateStr) {

                return '';

            }

            const [
                year,
                month,
                day
            ] =
                dateStr.split('-');

            if (
                !year ||
                !month ||
                !day
            ) {

                return dateStr;

            }

            const monthIdx =
                parseInt(
                    month,
                    10
                ) - 1;

            const monthName =
                levantMonths[
                    monthIdx
                ] || month;

            return `${parseInt(day, 10)} ${monthName} ${year}`;
        }


        /* =====================================================
           ESCAPE HTML
        ====================================================== */

        function escapeHtml(value) {

            return String(value)

                .replace(
                    /&/g,
                    '&amp;'
                )

                .replace(
                    /</g,
                    '&lt;'
                )

                .replace(
                    />/g,
                    '&gt;'
                )

                .replace(
                    /"/g,
                    '&quot;'
                )

                .replace(
                    /'/g,
                    '&#039;'
                );
        }


        /* =====================================================
           FILE TO BASE64
        ====================================================== */

        function fileToBase64(file) {

            return new Promise(
                (resolve, reject) => {

                    const reader =
                        new FileReader();

                    reader.onload =
                        () =>
                            resolve(
                                reader.result
                            );

                    reader.onerror =
                        reject;

                    reader.readAsDataURL(
                        file
                    );

                }
            );
        }


        /* =====================================================
           SAVE DATA
        ====================================================== */

        function saveData() {

            const data = {

                title:
                    document.getElementById(
                        'input-title'
                    ).value,

                aadad:
                    document.getElementById(
                        'input-3adad'
                    ).value,

                date:
                    document.getElementById(
                        'input-date'
                    ).value,

                bible:
                    document.getElementById(
                        'input-bible'
                    ).value,

                recommendations:
                    document.getElementById(
                        'input-recommendations'
                    ).value,

                footer:
                    document.getElementById(
                        'input-paperfooter'
                    ).value,

                days: {},

                news: []

            };


            /* ===============================================
               SAVE DAYS
            ================================================ */

            Object.keys(dayOffsets)
                .forEach(dayKey => {

                    const container =
                        document.getElementById(
                            `container-${dayKey}`
                        );

                    const subtitle =
                        document.getElementById(
                            `subtitle-${dayKey}`
                        );

                    const events = [];

                    container
                        .querySelectorAll(
                            '.event-row-input'
                        )
                        .forEach(row => {

                            const time =
                                row.querySelector(
                                    '.day-time-input'
                                )?.value || '';

                            const text =
                                row.querySelector(
                                    '.day-input'
                                )?.value || '';

                            events.push({

                                time: time,

                                text: text

                            });

                        });


                    data.days[dayKey] = {

                        subtitle:
                            subtitle
                                ? subtitle.value
                                : '',

                        events:
                            events

                    };

                });


            /* ===============================================
               SAVE NEWS
            ================================================ */

            document
                .querySelectorAll(
                    '.news-row-input'
                )
                .forEach(row => {

                    const titleInput =
                        row.querySelector(
                            '.news-title-input'
                        );

                    const preview =
                        row.querySelector(
                            '.news-preview'
                        );

                    data.news.push({

                        title:
                            titleInput
                                ? titleInput.value
                                : '',

                        image:
                            preview?.src || ''

                    });

                });


            try {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(data)
                );

            } catch (error) {

                console.error(
                    'Could not save data:',
                    error
                );

                alert(
                    'تعذّر حفظ البيانات. قد تكون صور الأخبار كبيرة جدًا بالنسبة لمساحة التخزين المحلية للمتصفح.'
                );
            }
        }


        /* =====================================================
           LOAD DATA
        ====================================================== */

        function loadData() {

            const saved =
                localStorage.getItem(
                    STORAGE_KEY
                );

            if (!saved) {

                return false;

            }


            try {

                const data =
                    JSON.parse(saved);


                /* ===========================================
                   GENERAL INPUTS
                ============================================ */

                document.getElementById(
                    'input-title'
                ).value =
                    data.title || '';


                document.getElementById(
                    'input-3adad'
                ).value =
                    data.aadad ||
                    'العدد ';


                document.getElementById(
                    'input-date'
                ).value =
                    data.date || '';


                document.getElementById(
                    'input-bible'
                ).value =
                    data.bible || '';


                document.getElementById(
                    'input-recommendations'
                ).value =
                    data.recommendations || '';


                document.getElementById(
                    'input-paperfooter'
                ).value =
                    data.footer ||
                    '1/1';


                /* ===========================================
                   DAYS
                ============================================ */

                Object.keys(dayOffsets)
                    .forEach(dayKey => {

                        const container =
                            document.getElementById(
                                `container-${dayKey}`
                            );

                        const subtitle =
                            document.getElementById(
                                `subtitle-${dayKey}`
                            );

                        container.innerHTML = '';


                        const dayData =
                            data.days?.[dayKey];


                        if (!dayData) {

                            createEventRow(
                                dayKey
                            );

                            return;

                        }


                        if (subtitle) {

                            subtitle.value =
                                dayData.subtitle ||
                                '';

                        }


                        (
                            dayData.events ||
                            []
                        )
                            .forEach(event => {

                                createEventRow(
                                    dayKey,
                                    event.time || '',
                                    event.text || ''
                                );

                            });


                        if (
                            !dayData.events ||
                            dayData.events.length === 0
                        ) {

                            createEventRow(
                                dayKey
                            );

                        }


                        updateDayOutput(
                            dayKey
                        );

                    });


                /* ===========================================
                   NEWS
                ============================================ */

                const newsContainer =
                    document.getElementById(
                        'container-news'
                    );

                newsContainer.innerHTML =
                    '';


                (
                    data.news || []
                )
                    .forEach(news => {

                        createNewsRow(
                            news.title || '',
                            news.image || ''
                        );

                    });


                if (
                    !data.news ||
                    data.news.length === 0
                ) {

                    createNewsRow();

                }


                updateNewsOutput();

                updateGeneralDisplay();

                return true;


            } catch (error) {

                console.error(
                    'Could not load saved data:',
                    error
                );

                return false;

            }
        }


        /* =====================================================
           CREATE EVENT ROW
        ====================================================== */

        function createEventRow(
            dayKey,
            timeValue = '',
            textValue = ''
        ) {

            const container =
                document.getElementById(
                    `container-${dayKey}`
                );

            const eventDiv =
                document.createElement(
                    'div'
                );

            eventDiv.className =
                'event-row-input';


            const timeInput =
                document.createElement(
                    'input'
                );

            timeInput.type =
                'time';

            timeInput.className =
                'day-time-input';

            timeInput.value =
                timeValue;


            const textInput =
                document.createElement(
                    'textarea'
                );

            textInput.className =

        /* =====================================================
           CREATE NEWS ROW
        ====================================================== */

        function createNewsRow(
            titleValue = '',
            imageValue = ''
        ) {

            const container =
                document.getElementById(
                    'container-news'
                );

            const newsDiv =
                document.createElement(
                    'div'
                );

            newsDiv.className =
                'news-row-input';


            const fields =
                document.createElement(
                    'div'
                );

            fields.className =
                'news-input-fields';


            const imageInput =
                document.createElement(
                    'input'
                );

            imageInput.type =
                'file';

            imageInput.accept =
                'image/*';

            imageInput.className =
                'news-img-input';


            const titleInput =
                document.createElement(
                    'textarea'
                );

            titleInput.className =
                'news-title-input';

            titleInput.placeholder =
                'عنوان الخبر / المحتوى...';

            titleInput.value =
                titleValue;


            fields.appendChild(
                imageInput
            );

            fields.appendChild(
                titleInput
            );


            const removeButton =
                document.createElement(
                    'button'
                );

            removeButton.type =
                'button';

            removeButton.className =
                'btn-remove-event';

            removeButton.textContent =
                '✕';


            const preview =
                document.createElement(
                    'img'
                );

            preview.className =
                'news-preview';

            preview.style.display =
                'none';


            if (imageValue) {

                preview.src =
                    imageValue;

            }


            newsDiv.appendChild(
                fields
            );

            newsDiv.appendChild(
                removeButton
            );

            newsDiv.appendChild(
                preview
            );

            container.appendChild(
                newsDiv
            );


            /* ===============================================
               NEWS TITLE
            ================================================ */

            titleInput.addEventListener(
                'input',
                () => {

                    updateNewsOutput();

                    saveData();

                }
            );


            /* ===============================================
               NEWS IMAGE
            ================================================ */

            imageInput.addEventListener(
                'change',
                async () => {

                    const file =
                        imageInput.files?.[0];

                    if (!file) {

                        return;

                    }


                    try {

                        const base64 =
                            await fileToBase64(
                                file
                            );

                        preview.src =
                            base64;

                        updateNewsOutput();

                        saveData();

                    } catch (error) {

                        console.error(
                            'Image error:',
                            error
                        );

                    }

                }
            );


            /* ===============================================
               REMOVE NEWS
            ================================================ */

            removeButton.addEventListener(
                'click',
                () => {

                    newsDiv.remove();

                    updateNewsOutput();

                    saveData();

                }
            );

        }


        /* =====================================================
           ADD NEWS
        ====================================================== */

        function addNewsRow() {

            createNewsRow();

            updateNewsOutput();

            saveData();

        }


        /* =====================================================
           NEWS OUTPUT
        ====================================================== */

        function updateNewsOutput() {

            const container =
                document.getElementById(
                    'container-news'
                );

            const rows =
                container.querySelectorAll(
                    '.news-row-input'
                );

            const gridDisplay =
                document.getElementById(
                    'display-news-grid'
                );

            const wrapperNews =
                document.getElementById(
                    'wrapper-news'
                );


            gridDisplay.innerHTML =
                '';


            let validCount =
                0;


            rows.forEach(row => {

                const titleInput =
                    row.querySelector(
                        '.news-title-input'
                    );

                const preview =
                    row.querySelector(
                        '.news-preview'
                    );


                const titleVal =
                    titleInput
                        ? titleInput.value.trim()
                        : '';


                const imageValue =
                    preview?.src || '';


                const file =
                    row.querySelector(
                        '.news-img-input'
                    )?.files?.[0] || null;


                if (
                    titleVal ||
                    file ||
                    imageValue
                ) {

                    validCount++;


                    const itemDiv =
                        document.createElement(
                            'div'
                        );

                    itemDiv.className =
                        'news-item';


                    const textDiv =
                        document.createElement(
                            'div'
                        );

                    textDiv.className =
                        'news-item-text';

                    textDiv.textContent =
                        titleVal;


                    const imgContainer =
                        document.createElement(
                            'div'
                        );

                    imgContainer.className =
                        'news-item-img';


                    const img =
                        document.createElement(
                            'img'
                        );


                    if (imageValue) {

                        img.src =
                            imageValue;

                    } else {

                        img.src =
                            'saint_george_assia.png';

                    }


                    imgContainer.appendChild(
                        img
                    );


                    itemDiv.appendChild(
                        imgContainer
                    );

                    itemDiv.appendChild(
                        textDiv
                    );


                    gridDisplay.appendChild(
                        itemDiv
                    );

                }

            });


            if (validCount > 0) {

                wrapperNews.classList.remove(
                    'is-hidden'
                );

            } else {

                wrapperNews.classList.add(
                    'is-hidden'
                );

            }

        }

        /* =====================================================
           UPDATE DAY OUTPUT
        ====================================================== */

        function updateDayOutput(
            dayKey
        ) {

            const container =
                document.getElementById(
                    `container-${dayKey}`
                );


            const eventRows =
                container.querySelectorAll(
                    '.event-row-input'
                );


            const targetRow =
                document.getElementById(
                    `row-${dayKey}`
                );


            const targetDisplay =
                document.getElementById(
                    `display-${dayKey}`
                );


            const subtitleInput =
                document.getElementById(
                    `subtitle-${dayKey}`
                );


            const subtitleDisplay =
                document.getElementById(
                    `display-subtitle-${dayKey}`
                );


            const subtitleVal =
                subtitleInput
                    ? subtitleInput.value.trim()
                    : '';


            if (subtitleDisplay) {

                subtitleDisplay.textContent =
                    subtitleVal;

            }


            let combinedHtml =
                '';

            let hasValidEvents =
                false;


            eventRows.forEach(row => {

                const timeInput =
                    row.querySelector(
                        '.day-time-input'
                    );


                const textInput =
                    row.querySelector(
                        '.day-input'
                    );


                const timeValue =
                    timeInput
                        ? timeInput.value
                        : '';


                const textValue =
                    textInput
                        ? textInput.value.trim()
                        : '';


                if (
                    timeValue ||
                    textValue
                ) {

                    hasValidEvents =
                        true;


                    let formattedTime =
                        '';


                    if (timeValue) {

                        const [
                            hours,
                            minutes
                        ] =
                            timeValue.split(':');


                        const hourNum =
                            parseInt(
                                hours,
                                10
                            );


                        const period =
                            hourNum >= 12
                                ? 'م'
                                : 'ص';


                        const displayHour =
                            hourNum % 12 || 12;


                        formattedTime =
                            `${displayHour}:${minutes} ${period} `;

                    }


                    combinedHtml += `

                        <div class="event-item-display">

                            <span class="day-time-tag">
                                ${formattedTime}
                            </span>

                            ${escapeHtml(
                                textValue
                            )}

                        </div>

                    `;

                }

            });


            if (
                hasValidEvents ||
                subtitleVal.length > 0
            ) {

                targetDisplay.innerHTML =
                    combinedHtml;


                targetRow.classList.remove(
                    'is-hidden'
                );

            } else {

                targetDisplay.innerHTML =
                    '';


                targetRow.classList.add(
                    'is-hidden'
                );

            }


            checkDaysHeaderVisibility();

        }

        /* =====================================================
           DOWNLOAD AS HIGH RESOLUTION PNG
        ====================================================== */

        async function downloadAsImage() {

            const paperElement =
                document.getElementById(
                    'paper-to-print'
                );


            const btn =
                document.querySelector(
                    '.print-btn'
                );


            if (btn) {

                btn.disabled =
                    true;

            }


            const origTransform =
                paperElement.style.transform;


            const origZoom =
                paperElement.style.zoom;


            paperElement.style.transform =
                'none';


            paperElement.style.zoom =
                '1';


            try {

                const canvas =
                    await html2canvas(
                        paperElement,
                        {

                            scale: 4,

                            useCORS: true,

                            allowTaint: true,

                            logging: false,

                            windowWidth: 794,

                            windowHeight: 1123

                        }
                    );


                const link =
                    document.createElement(
                        'a'
                    );


                link.download =
                    'saint_george_assia_highres.png';


                link.href =
                    canvas.toDataURL(
                        'image/png',
                        1.0
                    );


                document.body.appendChild(
                    link
                );


                link.click();


                document.body.removeChild(
                    link
                );


            } catch (err) {

                console.error(
                    'Export Error:',
                    err
                );


                alert(
                    'حدث خطأ أثناء تحميل الصورة.'
                );

            } finally {

                paperElement.style.transform =
                    origTransform;


                paperElement.style.zoom =
                    origZoom;


                if (btn) {

                    btn.disabled =
                        false;

                }

            }

        }


        /* =====================================================
           INITIALIZATION
        ====================================================== */

        initDates();


        const hasSavedData =
            loadData();


        if (!hasSavedData) {

            /* Create one event row
               for each day */

            Object.keys(dayOffsets)
                .forEach(dayKey => {

                    createEventRow(
                        dayKey
                    );

                });


            /* Create one empty
               news row */

            createNewsRow();

        }


        /* Final display refresh */

        updateGeneralDisplay();


        Object.keys(dayOffsets)
            .forEach(dayKey => {

                updateDayOutput(
                    dayKey
                );

            });


        updateNewsOutput();

    </script>
